name: Project 778G - Xendroid+ Snapdragon 778G tuned build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/project-778g-xendroid.yml"
      - "project-778g-xendroid/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-778g-xendroid
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/cirruslabs/android-sdk:35
    env:
      ANDROID_SDK_ROOT: /opt/android-sdk-linux
      ANDROID_NDK_VERSION: 29.0.14206865
      CMAKE_VERSION: 3.30.3
      BUILD_TOOLS_VERSION: 35.0.0
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      USE_CCACHE: "true"
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git ninja-build python3 glslang-tools spirv-tools ccache

      - name: Checkout Project 778G
        uses: actions/checkout@v4

      - name: Checkout Xendroid+ source
        run: |
          git clone --depth 1 https://github.com/phforner0/Xendroid-Plus.git xendroid
          cd xendroid
          echo "XENDROID_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "XENDROID_SHORT_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          for package in "ndk;$ANDROID_NDK_VERSION" "cmake;$CMAKE_VERSION" \
                         "build-tools;$BUILD_TOOLS_VERSION" "platforms;android-35"; do
            dir="$ANDROID_SDK_ROOT/$(echo "$package" | tr ';' '/')"
            [ -d "$dir" ] || sdkmanager "$package" > /dev/null
          done
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > xendroid/local.properties

      - name: Apply Snapdragon 778G CPU target
        working-directory: xendroid
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("emulator-core/src/main/cpp/CMakeLists.txt")
          s = p.read_text()
          old = "add_compile_options(-march=armv8.2-a+lse+dotprod+fp16+rcpc+crc)"
          new = "add_compile_options(-mcpu=cortex-a78)"
          if s.count(old) != 1:
              raise SystemExit("Expected ARM baseline flag exactly once; refusing unsafe patch")
          p.write_text(s.replace(old, new))
          print("Applied Cortex-A78 target for Snapdragon 778G performance cores")
          PY

      - name: Build optimised Xendroid+ release APK
        working-directory: xendroid
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --build-cache --parallel \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -PgitHash="$XENDROID_SHORT_SHA-778G" \
            -PxendroidReleaseIdSuffix=.778g \
            -PxendroidReleaseDebuggable \
            :app:assembleRelease
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android \
            --out app/build/outputs/apk/release/Project-778G-XendroidPlus.apk "$APK"
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify \
            app/build/outputs/apk/release/Project-778G-XendroidPlus.apk

      - name: Verify APK exists and report identity
        run: |
          APK="xendroid/app/build/outputs/apk/release/Project-778G-XendroidPlus.apk"
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          echo "Project 778G tuned release; source commit: $XENDROID_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Native CPU target: Cortex-A78; Release -O2 + ThinLTO" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: xendroid.compose.778g" >> "$GITHUB_STEP_SUMMARY"
          echo "Not yet device-benchmarked; no FPS guarantee." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and build identity
        uses: actions/upload-artifact@v4
        with:
          name: Project-778G-XendroidPlus-Snapdragon778G
          path: |
            xendroid/app/build/outputs/apk/release/Project-778G-XendroidPlus.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
