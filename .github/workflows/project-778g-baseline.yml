name: Project 778G - Liberty Recomp Android baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'os/android/scripts/build_native.sh'
      - '.github/workflows/project-778g-baseline.yml'

permissions:
  contents: read

jobs:
  build-android:
    # Upstream documents this Android build on Windows + Git Bash.
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The hosted Windows runner already has an Android SDK. Avoid
      # setup-android's attempt to install the obsolete SDK package "tools".
      - name: Install Android platform and NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { $sdkRoot = $env:ANDROID_SDK_ROOT }
          if (-not $sdkRoot -or -not (Test-Path $sdkRoot)) {
            throw "Android SDK root not found in ANDROID_HOME or ANDROID_SDK_ROOT."
          }

          $sdkManager = Get-ChildItem -Path (Join-Path $sdkRoot "cmdline-tools") -Filter "sdkmanager.bat" -Recurse -ErrorAction Stop |
            Select-Object -First 1
          if (-not $sdkManager) {
            throw "sdkmanager.bat was not found under $sdkRoot\cmdline-tools."
          }

          & $sdkManager.FullName --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager package installation failed with exit code $LASTEXITCODE." }

          1..100 | ForEach-Object { "y" } | & $sdkManager.FullName --licenses
          if ($LASTEXITCODE -ne 0) { throw "Android SDK license acceptance failed." }

          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_NDK=$sdkRoot\ndk\29.0.14206865" | Out-File -FilePath $env:GITHUB_ENV -Append
          "NDK_VER=29.0.14206865" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install CMake 3.31 and Ninja
        shell: pwsh
        run: |
          choco install cmake --version=3.31.6 --installargs 'ADD_CMAKE_TO_PATH=System' -y
          if ($LASTEXITCODE -ne 0) { throw "CMake installation failed." }
          choco install ninja -y
          if ($LASTEXITCODE -ne 0) { throw "Ninja installation failed." }

      - name: Build native libraries and debug APK
        shell: bash
        env:
          STRIP: "1"
        run: |
          set -euo pipefail

          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK="$(cygpath -u "$ANDROID_NDK")"
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"

          python --version
          java -version
          cmake --version
          ninja --version
          test -f "$ANDROID_NDK/build/cmake/android.toolchain.cmake"

          python tools/setup_repo.py
          bash os/android/scripts/build_driver_proxy.sh
          STRIP=1 bash os/android/scripts/build_native.sh
          rm -f os/android/app/build/outputs/apk/debug/app-debug.apk
          bash os/android/scripts/build_apk.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-778G-LibertyRecompAndroid-debug
          path: os/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
